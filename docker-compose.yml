services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jacobi_db
      POSTGRES_USER: jacobi_user
      POSTGRES_PASSWORD: jacobi_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jacobi_user -d jacobi_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  app1:
    build: ./backend
    environment:
      SERVER_ID: app1
      MAX_SLOTS: 2
      DB_HOST: db
      DB_NAME: jacobi_db
      DB_USER: jacobi_user
      DB_PASSWORD: jacobi_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  app2:
    build: ./backend
    environment:
      SERVER_ID: app2
      MAX_SLOTS: 2
      DB_HOST: db
      DB_NAME: jacobi_db
      DB_USER: jacobi_user
      DB_PASSWORD: jacobi_pass
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - app1
      - app2

  autoscaler:
    build: ./autoscaler
    environment:
      DB_HOST: db
      DB_NAME: jacobi_db
      DB_USER: jacobi_user
      DB_PASSWORD: jacobi_pass
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      app1:
        condition: service_started

volumes:
  postgres_data: